<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>親子れんらく帳</title>
  <style>
    :root {
      --bg-color: #f0f2f5;
      --card-bg: #ffffff;
      --primary: #4f46e5;
      --parent-color: #ec4899;
      --child-color: #3b82f6;
      --text-main: #1f2937;
      --text-sub: #6b7280;
      --border-color: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    #app {
      width: 100%;
      max-width: 500px;
      height: 100%;
      background-color: var(--card-bg);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .login-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: var(--card-bg);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .login-box { width: 100%; max-width: 320px; text-align: center; }

    .pin-input {
      width: 100%; padding: 14px; font-size: 18px; text-align: center;
      letter-spacing: 4px; border: 2px solid var(--border-color);
      border-radius: 12px; margin-bottom: 16px; outline: none;
    }

    .btn-login {
      width: 100%; padding: 14px; background-color: var(--primary);
      color: white; border: none; border-radius: 12px; font-size: 16px;
      font-weight: 600; cursor: pointer;
    }

    header {
      padding: 12px 16px; border-bottom: 1px solid var(--border-color);
      display: flex; justify-content: space-between; align-items: center;
    }

    .role-selector { display: flex; background: #f3f4f6; padding: 3px; border-radius: 20px; }
    .role-btn {
      padding: 6px 14px; font-size: 12px; font-weight: 600; border: none;
      border-radius: 16px; background: transparent; color: var(--text-sub); cursor: pointer;
    }
    .role-btn.active-parent { background: var(--parent-color); color: white; }
    .role-btn.active-child { background: var(--child-color); color: white; }

    .status-bar { font-size: 10px; text-align: center; color: var(--text-sub); padding: 4px; background: #f3f4f6; }

    .message-list {
      flex: 1; padding: 16px; overflow-y: auto; display: flex;
      flex-direction: column; gap: 12px; background: #f9fafb;
    }

    .msg-group { display: flex; flex-direction: column; max-width: 80%; }
    .msg-group.self { align-self: flex-end; align-items: flex-end; }
    .msg-group.other { align-self: flex-start; align-items: flex-start; }

    .sender-label { font-size: 11px; color: var(--text-sub); margin-bottom: 4px; }
    .bubble {
      padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4;
      word-break: break-word;
    }
    .msg-group.self .bubble { background-color: var(--primary); color: white; border-bottom-right-radius: 4px; }
    .msg-group.other .bubble { background-color: #ffffff; color: var(--text-main); border: 1px solid var(--border-color); border-bottom-left-radius: 4px; }
    .msg-time { font-size: 10px; color: #9ca3af; margin-top: 4px; }

    footer {
      padding: 12px 16px; background-color: #ffffff; border-top: 1px solid var(--border-color);
      display: flex; gap: 8px; align-items: center;
    }

    .input-msg {
      flex: 1; padding: 12px 16px; border: 1px solid var(--border-color);
      border-radius: 24px; font-size: 14px; outline: none; background-color: #f9fafb;
    }

    .btn-send {
      width: 40px; height: 40px; border-radius: 50%; background-color: var(--primary);
      color: white; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
  </style>
</head>
<body>

<div id="app">
  <!-- ログイン画面 -->
  <div id="loginScreen" class="login-overlay">
    <div class="login-box">
      <h2 style="margin-bottom:8px;">📌 親子れんらく帳</h2>
      <p style="font-size:12px; color:#666; margin-bottom:20px;">合言葉を入力してください</p>
      <input type="password" id="pinInput" class="pin-input" placeholder="••••" maxlength="8">
      <button id="loginBtn" class="btn-login">入る</button>
    </div>
  </div>

  <!-- ヘッダー -->
  <header>
    <div style="font-weight:bold;">📌 親子れんらく帳</div>
    <div class="role-selector">
      <button id="roleParent" class="role-btn">親</button>
      <button id="roleChild" class="role-btn">娘</button>
    </div>
  </header>

  <div class="status-bar" id="statusBar">接続を確認中...</div>
  <div class="message-list" id="messageList"></div>

  <footer>
    <input type="text" id="msgInput" class="input-msg" placeholder="メッセージを入力..." autocomplete="off">
    <button id="sendBtn" class="btn-send">➤</button>
  </footer>
</div>

<script>
  // 共通の無料データ保存領域 (KVdb.io)
  const KV_KEY = 'family_chat_msg_data_v1';
  const API_URL = `https://kvdb.io/4y9U6hN8pM3jK2X8Z9wQ1E/${KV_KEY}`;

  const DEFAULT_PIN = "1234";
  let currentRole = localStorage.getItem('family_chat_role') || 'child';
  let messages = [];

  const loginScreen = document.getElementById('loginScreen');
  const pinInput = document.getElementById('pinInput');
  const loginBtn = document.getElementById('loginBtn');
  const roleParent = document.getElementById('roleParent');
  const roleChild = document.getElementById('roleChild');
  const messageList = document.getElementById('messageList');
  const msgInput = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const statusBar = document.getElementById('statusBar');

  // 自動ログイン
  if (localStorage.getItem('family_chat_auth') === 'true') {
    loginScreen.style.display = 'none';
    initChat();
  }

  loginBtn.addEventListener('click', handleLogin);
  pinInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });

  function handleLogin() {
    if (pinInput.value.trim() === DEFAULT_PIN) {
      localStorage.setItem('family_chat_auth', 'true');
      loginScreen.style.display = 'none';
      initChat();
    } else {
      alert('合言葉が違います');
      pinInput.value = '';
    }
  }

  function updateRoleUI() {
    roleParent.className = currentRole === 'parent' ? 'role-btn active-parent' : 'role-btn';
    roleChild.className = currentRole === 'child' ? 'role-btn active-child' : 'role-btn';
    localStorage.setItem('family_chat_role', currentRole);
    renderMessages();
  }

  roleParent.addEventListener('click', () => { currentRole = 'parent'; updateRoleUI(); });
  roleChild.addEventListener('click', () => { currentRole = 'child'; updateRoleUI(); });

  function initChat() {
    updateRoleUI();
    fetchMessages();
    setInterval(fetchMessages, 3000); // 3秒ごとに自動更新
  }

  // サーバーから取得
  async function fetchMessages() {
    try {
      const res = await fetch(API_URL);
      if (res.ok) {
        const data = await res.json();
        if (Array.isArray(data)) {
          messages = data;
          renderMessages();
          statusBar.textContent = '同期中 (' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + ')';
        }
      }
    } catch (e) {
      statusBar.textContent = '通信準備中...';
    }
  }

  // 送信処理
  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

  async function sendMessage() {
    const text = msgInput.value.trim();
    if (!text) return;

    sendBtn.disabled = true;
    const newMsg = {
      id: Date.now(),
      sender: currentRole,
      text: text,
      time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
    };

    // 最新のリストを取得してから追加して送信
    try {
      const getRes = await fetch(API_URL);
      let currentMsgs = [];
      if (getRes.ok) {
        currentMsgs = await getRes.json();
      }
      currentMsgs.push(newMsg);

      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(currentMsgs)
      });

      messages = currentMsgs;
      renderMessages();
      msgInput.value = '';
      statusBar.textContent = '送信完了';
    } catch (e) {
      alert('送信に失敗しました。時間をおいて再試行してください。');
    } finally {
      sendBtn.disabled = false;
    }
  }

  function renderMessages() {
    messageList.innerHTML = '';
    messages.forEach(msg => {
      const isSelf = msg.sender === currentRole;
      const group = document.createElement('div');
      group.className = `msg-group ${isSelf ? 'self' : 'other'}`;
      const senderText = msg.sender === 'parent' ? '親' : '娘';

      group.innerHTML = `
        <div class="sender-label">${isSelf ? '自分' : senderText}</div>
        <div class="bubble">${escapeHtml(msg.text)}</div>
        <div class="msg-time">${msg.time}</div>
      `;
      messageList.appendChild(group);
    });
    messageList.scrollTop = messageList.scrollHeight;
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  }
</script>
</body>
</html>
