<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>親子れんらく帳</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      background-color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
    }
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
  </style>
</head>
<body class="h-screen w-screen flex justify-center items-center overflow-hidden">

  <!-- App Wrapper -->
  <div id="app" class="w-full max-w-md h-full bg-white flex flex-col relative shadow-xl overflow-hidden">

    <!-- 1. Passcode / Login Screen -->
    <div id="loginOverlay" class="absolute inset-0 bg-slate-900/40 backdrop-blur-md z-50 flex items-center justify-center p-6">
      <div class="bg-white w-full max-w-xs rounded-3xl p-6 shadow-2xl text-center border border-slate-100">
        <div class="w-16 h-16 bg-indigo-100 rounded-2xl flex items-center justify-center mx-auto mb-4 text-indigo-600 text-2xl shadow-inner">
          <i class="fa-solid fa-lock"></i>
        </div>
        <h2 class="text-xl font-bold text-slate-800 mb-1">親子れんらく帳</h2>
        <p class="text-xs text-slate-500 mb-6">あいことばを入力してね</p>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
          <input type="password" id="pinInput" maxlength="8" pattern="[0-9]*" inputmode="numeric" placeholder="あいことば" required
            class="w-full px-4 py-3 text-center text-xl tracking-widest rounded-2xl border-2 border-slate-200 focus:border-indigo-500 focus:outline-none transition">
          <button type="submit" 
            class="w-full bg-indigo-500 hover:bg-indigo-600 active:bg-indigo-700 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-indigo-100 transition">
            入る
          </button>
        </form>
        <p id="loginError" class="text-xs text-rose-500 mt-3 hidden font-bold">あいことばがちがいます</p>
        <p class="text-[11px] text-slate-400 mt-4">※ しょきあいことば: <span class="font-bold">1234</span></p>
      </div>
    </div>

    <!-- 2. Header -->
    <header class="bg-white border-b border-slate-100 py-3 px-4 flex items-center justify-between shrink-0 z-10 shadow-sm">
      <div class="flex items-center space-x-2.5">
        <div class="w-9 h-9 bg-gradient-to-tr from-indigo-500 to-indigo-600 text-white rounded-xl flex items-center justify-center font-bold text-base shadow-sm">
          <i class="fa-solid fa-comments"></i>
        </div>
        <div>
          <h1 class="font-bold text-base text-slate-800 leading-tight">親子れんらく帳</h1>
          <span id="syncStatus" class="text-[10px] text-emerald-500 font-bold flex items-center gap-1">
            <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span> どうき中...
          </span>
        </div>
      </div>

      <!-- Role Switcher -->
      <div class="bg-slate-100 p-1 rounded-xl flex text-xs font-bold gap-1">
        <button id="roleParentBtn" onclick="setRole('親')" class="px-3 py-1.5 rounded-lg transition-all">親</button>
        <button id="roleChildBtn" onclick="setRole('娘')" class="px-3 py-1.5 rounded-lg transition-all">娘</button>
      </div>
    </header>

    <!-- 3. Message Feed -->
    <main id="chatFeed" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50/70">
      <!-- Loading indicator -->
      <div id="loadingBox" class="text-center py-10 text-slate-400">
        <i class="fa-solid fa-spinner animate-spin text-2xl mb-2"></i>
        <p class="text-xs">メッセージをよみこみ中...</p>
      </div>
    </main>

    <!-- 4. Quick Presets -->
    <div class="bg-white border-t border-slate-100 px-3 py-2 flex gap-2 overflow-x-auto shrink-0 no-scrollbar">
      <button onclick="sendQuickMessage('雨だから車で迎えに行こうか？')" class="whitespace-nowrap px-3 py-1.5 bg-indigo-50 text-indigo-600 hover:bg-indigo-100 rounded-full text-xs font-bold transition border border-indigo-100">
        ☔ 雨だから車で迎えに行こうか？
      </button>
      <button onclick="sendQuickMessage('16:30に校門前で')" class="whitespace-nowrap px-3 py-1.5 bg-indigo-50 text-indigo-600 hover:bg-indigo-100 rounded-full text-xs font-bold transition border border-indigo-100">
        🏫 16:30に校門前で
      </button>
      <button onclick="sendQuickMessage('気を付けて帰ってきてね！')" class="whitespace-nowrap px-3 py-1.5 bg-indigo-50 text-indigo-600 hover:bg-indigo-100 rounded-full text-xs font-bold transition border border-indigo-100">
        🏠 気を付けて帰ってきてね！
      </button>
      <button onclick="sendQuickMessage('りょうかい！')" class="whitespace-nowrap px-3 py-1.5 bg-emerald-50 text-emerald-600 hover:bg-emerald-100 rounded-full text-xs font-bold transition border border-emerald-100">
        👍 りょうかい！
      </button>
    </div>

    <!-- 5. Footer / Message Input -->
    <footer class="bg-white border-t border-slate-200 p-3 shrink-0">
      <form onsubmit="handleSendMessage(event)" class="flex gap-2 items-center">
        <input type="text" id="messageInput" placeholder="メッセージを入力..." required autocomplete="off"
          class="flex-1 bg-slate-100 px-4 py-3 rounded-2xl text-sm border-0 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
        <button type="submit" id="sendBtn" class="bg-indigo-500 hover:bg-indigo-600 active:bg-indigo-700 text-white w-11 h-11 rounded-2xl flex items-center justify-center shrink-0 shadow-md shadow-indigo-100 transition disabled:opacity-50">
          <i class="fa-solid fa-paper-plane text-sm"></i>
        </button>
      </form>
    </footer>

  </div>

  <script>
    // Database Configuration (Firebase Public Realtime Database Endpoint)
    // 登録不要で永続保存・高速アクセスが可能な公開リアルタイムデータベース
    const DB_ENDPOINT = "https://family-board-sync-default-rtdb.firebaseio.com/messages";
    
    // Auth & Local Storage Keys
    const AUTH_KEY = "family_board_authenticated_v2";
    const ROLE_KEY = "family_board_current_role_v2";
    const DEFAULT_PASS = "1234";

    let currentRole = localStorage.getItem(ROLE_KEY) || '親';
    let messages = [];
    let isFetching = false;
    let lastRenderedHash = "";

    // App Initialization
    window.onload = function() {
      // Check if already authenticated
      if (localStorage.getItem(AUTH_KEY) === "true") {
        document.getElementById('loginOverlay').classList.add('hidden');
      }
      updateRoleUI();
      startRealtimeSync();
    };

    // Passcode Login Handler
    function handleLogin(e) {
      e.preventDefault();
      const inputPass = document.getElementById('pinInput').value.trim();

      if (inputPass === DEFAULT_PASS) {
        localStorage.setItem(AUTH_KEY, "true");
        document.getElementById('loginOverlay').classList.add('hidden');
        document.getElementById('pinInput').value = '';
        document.getElementById('loginError').classList.add('hidden');
      } else {
        document.getElementById('loginError').classList.remove('hidden');
      }
    }

    // Role Switching Handler
    function setRole(role) {
      currentRole = role;
      localStorage.setItem(ROLE_KEY, role);
      updateRoleUI();
      renderMessages();
    }

    function updateRoleUI() {
      const parentBtn = document.getElementById('roleParentBtn');
      const childBtn = document.getElementById('roleChildBtn');

      if (currentRole === '親') {
        parentBtn.className = "px-3.5 py-1.5 rounded-lg transition-all bg-white text-indigo-600 shadow-sm";
        childBtn.className = "px-3.5 py-1.5 rounded-lg transition-all text-slate-500 hover:text-slate-700";
      } else {
        childBtn.className = "px-3.5 py-1.5 rounded-lg transition-all bg-white text-pink-600 shadow-sm";
        parentBtn.className = "px-3.5 py-1.5 rounded-lg transition-all text-slate-500 hover:text-slate-700";
      }
    }

    // Realtime Database Sync Engine (Polled every 2.5 seconds)
    function startRealtimeSync() {
      fetchMessages();
      setInterval(fetchMessages, 2500);
    }

    async function fetchMessages() {
      if (isFetching) return;
      isFetching = true;

      try {
        const response = await fetch(`${DB_ENDPOINT}.json`);
        if (response.ok) {
          const data = await response.json();
          const loadedMsgs = [];
          
          if (data) {
            Object.keys(data).forEach(key => {
              loadedMsgs.push({ id: key, ...data[key] });
            });
            // Sort by timestamp
            loadedMsgs.sort((a, b) => a.timestamp - b.timestamp);
          }

          messages = loadedMsgs;
          
          // Render only when data changes to prevent unnecessary DOM redraws
          const currentHash = JSON.stringify(messages);
          if (currentHash !== lastRenderedHash) {
            lastRenderedHash = currentHash;
            renderMessages();
          }

          updateSyncStatus(true);
        } else {
          updateSyncStatus(false);
        }
      } catch (err) {
        console.error("Sync error:", err);
        updateSyncStatus(false);
      } finally {
        isFetching = false;
        const loadingBox = document.getElementById('loadingBox');
        if (loadingBox) loadingBox.remove();
      }
    }

    function updateSyncStatus(isOnline) {
      const statusEl = document.getElementById('syncStatus');
      if (isOnline) {
        statusEl.className = "text-[10px] text-emerald-500 font-bold flex items-center gap-1";
        statusEl.innerHTML = `<span class="w-2 h-2 bg-emerald-500 rounded-full animate-ping"></span> つながっています`;
      } else {
        statusEl.className = "text-[10px] text-amber-500 font-bold flex items-center gap-1";
        statusEl.innerHTML = `<span class="w-2 h-2 bg-amber-500 rounded-full"></span> さいせつぞく中...`;
      }
    }

    // Message Sending Handler
    async function handleSendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      await addMessage(text);
      input.value = '';
    }

    async function sendQuickMessage(text) {
      await addMessage(text);
    }

    async function addMessage(text) {
      const sendBtn = document.getElementById('sendBtn');
      sendBtn.disabled = true;

      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      const newMsg = {
        sender: currentRole,
        text: text,
        time: timeStr,
        timestamp: Date.now()
      };

      try {
        // Send message via HTTP POST request
        const res = await fetch(`${DB_ENDPOINT}.json`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newMsg)
        });

        if (res.ok) {
          // Immediately pull updated list
          fetchMessages();
        } else {
          alert("送信できませんでした。電波の良い場所でお試しください。");
        }
      } catch (err) {
        alert("通信エラーが発生しました。");
      } finally {
        sendBtn.disabled = false;
      }
    }

    // UI Render Engine
    function renderMessages() {
      const feed = document.getElementById('chatFeed');
      feed.innerHTML = '';

      if (messages.length === 0) {
        feed.innerHTML = `
          <div class="text-center py-16 text-slate-400">
            <i class="fa-regular fa-comments text-4xl mb-3 text-slate-300"></i>
            <p class="text-xs font-bold">まだメッセージはありません</p>
            <p class="text-[10px] text-slate-400 mt-1">下の入力らんから送信してみてね！</p>
          </div>
        `;
        return;
      }

      messages.forEach(msg => {
        const isSelf = msg.sender === currentRole;
        const msgWrapper = document.createElement('div');
        msgWrapper.className = `flex flex-col ${isSelf ? 'items-end' : 'items-start'} mb-1.5`;

        const senderLabel = document.createElement('span');
        senderLabel.className = 'text-[10px] text-slate-400 mb-1 px-1 font-bold';
        senderLabel.innerText = `${msg.sender} • ${msg.time}`;

        const bubble = document.createElement('div');
        
        if (isSelf) {
          bubble.className = "max-w-[82%] px-4 py-2.5 rounded-2xl text-sm shadow-sm leading-relaxed bg-indigo-500 text-white rounded-tr-none font-medium";
        } else {
          bubble.className = "max-w-[82%] px-4 py-2.5 rounded-2xl text-sm shadow-sm leading-relaxed bg-white text-slate-800 border border-slate-100 rounded-tl-none font-medium";
        }

        bubble.innerText = msg.text;

        msgWrapper.appendChild(senderLabel);
        msgWrapper.appendChild(bubble);
        feed.appendChild(msgWrapper);
      });

      // Smooth scroll to bottom
      feed.scrollTop = feed.scrollHeight;
    }
  </script>
</body>
</html>
