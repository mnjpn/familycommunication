<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>うちの連絡帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EAF1F5;
    --ink: #1F2A36;
    --muted: #6B7A88;
    --mine: #FFE7A3;      /* 自分：付箋の黄色 */
    --theirs: #FFFFFF;    /* 相手：白い紙 */
    --accent: #2F6F9E;    /* 制服の紺 */
    --line: #C9D6DF;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #16202A; --ink: #E8EEF3; --muted: #93A3B1;
      --mine: #6B5A22; --theirs: #25313D; --accent: #7FB3DA; --line: #33414E;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
    font-size: 17px; line-height: 1.6;
  }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ログイン */
  #login { height: 100%; display: grid; place-items: center; padding: 24px; }
  .login-box { width: 100%; max-width: 340px; }
  .login-box h1 { font-size: 30px; margin: 0 0 4px; letter-spacing: .04em; }
  .login-box p { margin: 0 0 24px; color: var(--muted); }
  .who { display: flex; gap: 10px; margin-bottom: 14px; }
  .who button {
    flex: 1; padding: 14px 8px; border-radius: 14px; cursor: pointer;
    border: 2px solid var(--line); background: var(--theirs); font-weight: 700;
  }
  .who button[aria-pressed="true"] { border-color: var(--accent); background: var(--mine); }
  #pw {
    width: 100%; padding: 14px; border-radius: 14px;
    border: 2px solid var(--line); background: var(--theirs);
  }
  #loginBtn {
    width: 100%; margin-top: 14px; padding: 14px; border: 0; border-radius: 14px;
    background: var(--accent); color: #fff; font-weight: 700; cursor: pointer;
  }
  #loginErr { color: #C0392B; min-height: 1.6em; margin-top: 10px; font-size: 15px; }

  /* チャット */
  #chat { height: 100%; display: flex; flex-direction: column; max-width: 720px; margin: 0 auto; }
  header {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 20px; margin: 0; }
  #logout { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 14px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; }
  .empty { color: var(--muted); text-align: center; margin-top: 30%; }
  .day { text-align: center; color: var(--muted); font-size: 13px; margin: 18px 0 8px; }
  .msg { display: flex; flex-direction: column; margin: 6px 0; align-items: flex-start; }
  .msg.me { align-items: flex-end; }
  .bubble {
    max-width: 80%; padding: 8px 14px; border-radius: 4px 16px 16px 16px;
    background: var(--theirs); white-space: pre-wrap; word-break: break-word;
    box-shadow: 0 1px 0 var(--line);
  }
  .msg.me .bubble { background: var(--mine); border-radius: 16px 4px 16px 16px; }
  .meta { font-size: 12px; color: var(--muted); margin: 2px 4px 0; }

  .quick { display: flex; gap: 8px; overflow-x: auto; padding: 8px 12px 0; }
  .quick button {
    flex: none; padding: 6px 12px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--theirs); font-size: 14px;
  }
  form { display: flex; gap: 8px; padding: 10px 12px 12px; }
  #text {
    flex: 1; resize: none; padding: 10px 14px; border-radius: 18px;
    border: 2px solid var(--line); background: var(--theirs); height: 46px;
  }
  #send {
    padding: 0 18px; border: 0; border-radius: 18px; background: var(--accent);
    color: #fff; font-weight: 700; cursor: pointer;
  }
  #send:disabled { opacity: .5; }
</style>
</head>
<body>

<div id="login">
  <div class="login-box">
    <h1>うちの連絡帳</h1>
    <p>だれが使う？</p>
    <div class="who" id="who"></div>
    <input id="pw" type="password" placeholder="パスワード" autocomplete="current-password">
    <button id="loginBtn">入る</button>
    <div id="loginErr" role="alert"></div>
  </div>
</div>

<div id="chat" hidden>
  <header>
    <h1>うちの連絡帳</h1>
    <button id="logout">ログアウト</button>
  </header>
  <div id="log" aria-live="polite"></div>
  <div class="quick" id="quick"></div>
  <form id="form">
    <textarea id="text" placeholder="メッセージ" maxlength="500"></textarea>
    <button id="send" type="submit">送る</button>
  </form>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, addDoc, query, orderBy, limitToLast, onSnapshot, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ▼▼▼ ここを自分の値に書き換える ▼▼▼
  const firebaseConfig = {
  apiKey: "AIzaSyDTlLo6HdNqjS4vlsotdH7uEw1iZuZrAqk",
  authDomain: "family-chat-43a6d.firebaseapp.com",
  projectId: "family-chat-43a6d",
  storageBucket: "family-chat-43a6d.firebasestorage.app",
  messagingSenderId: "102848045527",
  appId: "1:102848045527:web:17379e769a32af4673ab92",
  };
  // Firebaseで作ったユーザーのメールアドレスと表示名
  const MEMBERS = [
    { name: "父", email: "masato.nogami.1028@gmail.com" },
    { name: "母",   email: "harumiaoki@gmail.com" },
    { name: "Canon",   email: "canon@gmail.com" },
  ];
  // よく使う定型文（タップで入力欄に入る）
  const QUICK = ["了解！", "ありがとう！", "今から帰る", "確認した？", "持って帰るの忘れないで","お腹すいた"];
  // ▲▲▲ ここまで ▲▲▲

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const $ = (id) => document.getElementById(id);

  // ログイン画面
  let selected = null;
  MEMBERS.forEach((m) => {
    const b = document.createElement("button");
    b.textContent = m.name;
    b.setAttribute("aria-pressed", "false");
    b.onclick = () => {
      selected = m;
      [...$("who").children].forEach((c) => c.setAttribute("aria-pressed", String(c === b)));
      $("pw").focus();
    };
    $("who").appendChild(b);
  });

  async function login() {
    $("loginErr").textContent = "";
    if (!selected) { $("loginErr").textContent = "だれが使うかを選んでください。"; return; }
    try {
      await signInWithEmailAndPassword(auth, selected.email, $("pw").value);
      $("pw").value = "";
    } catch {
      $("loginErr").textContent = "パスワードが違います。もう一度入れてください。";
    }
  }
  $("loginBtn").onclick = login;
  $("pw").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) login(); });
  $("logout").onclick = () => signOut(auth);

  // 定型文
  QUICK.forEach((t) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = t;
    b.onclick = () => { $("text").value = t; $("text").focus(); };
    $("quick").appendChild(b);
  });

  // メッセージ表示
  let unsub = null;
  const nameOf = (email) => (MEMBERS.find((m) => m.email === email) || {}).name || "?";
  const fmtDay = (d) => `${d.getMonth() + 1}月${d.getDate()}日（${"日月火水木金土"[d.getDay()]}）`;
  const fmtTime = (d) => `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`;

  function render(docs, me) {
    const log = $("log");
    log.innerHTML = "";
    if (docs.length === 0) {
      log.innerHTML = '<p class="empty">まだメッセージはありません。下の欄から送れます。</p>';
      return;
    }
    let lastDay = "";
    docs.forEach((d) => {
      const m = d.data();
      const date = m.createdAt ? m.createdAt.toDate() : new Date();
      const day = fmtDay(date);
      if (day !== lastDay) {
        const s = document.createElement("div");
        s.className = "day"; s.textContent = day;
        log.appendChild(s); lastDay = day;
      }
      const row = document.createElement("div");
      row.className = "msg" + (m.sender === me ? " me" : "");
      const bubble = document.createElement("div");
      bubble.className = "bubble"; bubble.textContent = m.text;
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = (m.sender === me ? "" : nameOf(m.sender) + "  ") + fmtTime(date);
      row.append(bubble, meta);
      log.appendChild(row);
    });
    log.scrollTop = log.scrollHeight;
  }

  onAuthStateChanged(auth, (user) => {
    if (unsub) { unsub(); unsub = null; }
    $("login").hidden = !!user;
    $("chat").hidden = !user;
    if (!user) return;
    const q = query(collection(db, "messages"), orderBy("createdAt"), limitToLast(200));
    unsub = onSnapshot(q, (snap) => render(snap.docs, user.email),
      () => { $("log").innerHTML = '<p class="empty">読み込めませんでした。通信状態を確認して、ページを再読み込みしてください。</p>'; });
  });

  // 送信
  async function send(e) {
    e && e.preventDefault();
    const text = $("text").value.trim();
    if (!text) return;
    $("send").disabled = true;
    try {
      await addDoc(collection(db, "messages"), {
        text, sender: auth.currentUser.email, createdAt: serverTimestamp(),
      });
      $("text").value = "";
    } catch {
      alert("送れませんでした。通信状態を確認して、もう一度送ってください。");
    } finally {
      $("send").disabled = false;
    }
  }
  $("form").addEventListener("submit", send);
  $("text").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) send(e);
  });
</script>
</body>
</html>
